version: "3.8"

services:
  # Ollama - 本地 LLM 和 Embedding 推理服务
  ollama:
    image: ollama/ollama:latest
    container_name: agilink-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  # AGILink - 记忆中心服务
  agilink:
    build: .
    container_name: agilink-app
    ports:
      - "43210:43210"
    volumes:
      - agilink-data:/root/.agilink
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-data:
  agilink-data:
